<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">MandiPulse recommendation-first home screen</title>
  <desc id="desc">Representative product preview showing decision inputs and three risk-adjusted mandi recommendations for the frozen October 30 2025 snapshot.</desc>
  <rect width="1280" height="820" fill="#f8fafc"/>
  <rect width="1280" height="68" fill="#111827"/>
  <text x="42" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700">MandiPulse India</text>
  <text x="320" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Sell decision</text>
  <text x="470" y="42" fill="#d1d5db" font-family="Arial, sans-serif" font-size="16">Data coverage</text>
  <text x="630" y="42" fill="#d1d5db" font-family="Arial, sans-serif" font-size="16">Forecast</text>
  <text x="745" y="42" fill="#d1d5db" font-family="Arial, sans-serif" font-size="16">Recommendation</text>
  <rect x="42" y="92" width="1196" height="48" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="62" y="122" fill="#92400e" font-family="Arial, sans-serif" font-size="15"><tspan font-weight="700">Demo snapshot</tspan><tspan> — data ends 2025-10-30. Numbers are frozen; no live data feed.</tspan></text>
  <text x="42" y="188" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="14" font-weight="700">MAHARASHTRA ONION · 7-DAY DECISION SUPPORT</text>
  <text x="42" y="232" fill="#111827" font-family="Arial, sans-serif" font-size="35" font-weight="700">Choose the mandi with the best risk-adjusted return.</text>
  <text x="42" y="264" fill="#4b5563" font-family="Arial, sans-serif" font-size="17">Enter the lot and transport assumptions. MandiPulse ranks the frozen snapshot by forecast price,</text>
  <text x="42" y="289" fill="#4b5563" font-family="Arial, sans-serif" font-size="17">transport cost, and an explicit uncertainty penalty.</text>
  <rect x="42" y="320" width="1196" height="112" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="62" y="346" fill="#111827" font-family="Arial, sans-serif" font-size="16" font-weight="700">Decision inputs</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#374151">
    <text x="62" y="374">Farmer location</text><text x="365" y="374">Quantity (quintals)</text><text x="668" y="374">Transport rate (INR/km/qtl)</text><text x="971" y="374">Maximum road radius (km)</text>
  </g>
  <g fill="#ffffff" stroke="#9ca3af">
    <rect x="62" y="385" width="250" height="34" rx="7"/><rect x="365" y="385" width="250" height="34" rx="7"/><rect x="668" y="385" width="250" height="34" rx="7"/><rect x="971" y="385" width="245" height="34" rx="7"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#111827">
    <text x="76" y="407">Nashik (default)</text><text x="379" y="407">100</text><text x="682" y="407">4.0</text><text x="985" y="407">500</text>
  </g>
  <rect x="42" y="454" width="1196" height="48" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="62" y="483" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="15" font-weight="700">Recommendation snapshot: as-of 2025-10-30</text>
  <text x="450" y="483" fill="#1e40af" font-family="Arial, sans-serif" font-size="14">10 current candidates · 5 stale forecasts excluded · 0 outside 500 km</text>
  <text x="42" y="545" fill="#111827" font-family="Arial, sans-serif" font-size="23" font-weight="700">Top recommendations</text>
  <text x="42" y="570" fill="#4b5563" font-family="Arial, sans-serif" font-size="15">Ranked by expected net price minus an uncertainty penalty. Prices are per quintal; lot estimates use 100 qtl.</text>
  <g>
    <rect x="42" y="596" width="374" height="182" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <rect x="432" y="596" width="374" height="182" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="822" y="596" width="416" height="182" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="62" y="621" fill="#6b7280" font-size="12" font-weight="700">#1 RECOMMENDATION</text><text x="62" y="647" fill="#111827" font-size="19" font-weight="700">Pimpalgaon</text><text x="62" y="666" fill="#6b7280" font-size="12">Nashik</text><rect x="316" y="629" width="77" height="24" rx="12" fill="#fef2f2"/><text x="329" y="646" fill="#991b1b" font-size="12" font-weight="700">high risk</text>
    <text x="62" y="699" fill="#4b5563" font-size="12">Forecast 1,439 · interval 1,229–1,732</text><text x="62" y="718" fill="#4b5563" font-size="12">Transport 144 · net 1,296 INR/qtl</text><text x="62" y="743" fill="#374151" font-size="12">Highest risk-adjusted net price among eligible mandis.</text>
    <text x="452" y="621" fill="#6b7280" font-size="12" font-weight="700">#2 RECOMMENDATION</text><text x="452" y="647" fill="#111827" font-size="19" font-weight="700">Lasalgaon</text><text x="452" y="666" fill="#6b7280" font-size="12">Nashik</text><rect x="706" y="629" width="84" height="24" rx="12" fill="#fef2f2"/><text x="719" y="646" fill="#991b1b" font-size="12" font-weight="700">high risk</text>
    <text x="452" y="699" fill="#4b5563" font-size="12">Forecast 1,276 · interval 1,066–1,569</text><text x="452" y="718" fill="#4b5563" font-size="12">Transport 260 · net 1,016 INR/qtl</text><text x="452" y="743" fill="#374151" font-size="12">Next-best risk-adjusted net price after penalties.</text>
    <text x="842" y="621" fill="#6b7280" font-size="12" font-weight="700">#3 RECOMMENDATION</text><text x="842" y="647" fill="#111827" font-size="19" font-weight="700">Vashi New Mumbai</text><text x="842" y="666" fill="#6b7280" font-size="12">Mumbai</text><rect x="1137" y="629" width="81" height="24" rx="12" fill="#fef2f2"/><text x="1151" y="646" fill="#991b1b" font-size="12" font-weight="700">high risk</text>
    <text x="842" y="699" fill="#4b5563" font-size="12">Forecast 1,414 · interval 1,204–1,707</text><text x="842" y="718" fill="#4b5563" font-size="12">Transport 680 · net 735 INR/qtl</text><text x="842" y="743" fill="#374151" font-size="12">Third-best eligible score after transport and risk.</text>
  </g>
</svg>
